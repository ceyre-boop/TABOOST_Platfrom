<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Manager Hub - TABOOST</title>
<link rel="icon" type="image/jpeg" href="images/taboost-genie.jpg">
<style>
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#1a1a1a;--line:#2a2a2a;--text:#ffffff;--mute:#9a9a9a;--green:#FF0055;--ok:#00ff88;--gold:#ffd700;--orange:#ffaa00;--pink:#FF0055;--blue:#ffffff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 80px}
header{display:flex;align-items:center;gap:12px;padding:16px 0;flex-wrap:wrap}
header h1{font-size:22px;margin:0;flex:1;min-width:180px}
header h1 small{display:block;font-size:12px;color:var(--mute);font-weight:400}
.hb{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;position:relative}
.hb:hover{border-color:var(--green)}
#bellN{position:absolute;top:-7px;right:-7px;background:var(--pink);color:#fff;border-radius:99px;font-size:11px;padding:1px 6px;font-weight:700}
#switcher{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 14px;white-space:nowrap}
.chip b{color:var(--mute);font-weight:600;margin-left:4px}
.chip.on{background:var(--green);color:#fff;border-color:var(--green)}.chip.on b{color:#fff}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0 22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .v{font-size:26px;font-weight:800}.stat .l{font-size:12px;color:var(--mute)}
.stat.s50 .v{color:var(--blue)}.stat.s70 .v{color:var(--ok)}.stat.s90 .v{color:var(--gold)}.stat.near .v{color:var(--pink)}
section h2{font-size:17px;margin:26px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
section h2 .sp{flex:1}
#kinds{display:flex;gap:6px}
#kinds button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:13px}
#kinds button.on{border-color:var(--green);color:var(--green)}
#watchBody{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.wcol{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;max-height:440px;overflow:auto}
.wcol h3{margin:0 0 8px;font-size:15px}.wcol h3 span{color:var(--mute);font-weight:500;margin-left:4px}
.none{color:var(--mute);font-size:14px;margin:6px 0}
.mcard{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:7px}
.mcard:hover{border-color:var(--green)}
.mcard .ico{font-size:18px}.mcard .mt{flex:1;min-width:0;display:flex;flex-direction:column}
.mcard .mt b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mcard small{color:var(--mute)}
.mcard em{font-style:normal;font-size:12px;color:var(--mute)}
.mcard.big.hit{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.mcard.big.about{border-color:var(--pink)}
.mcard.big.about small{color:#ff7aa6}
#tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
#tools input[type=search],#tools select{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit}
#tools label{color:var(--mute);font-size:14px;display:flex;gap:6px;align-items:center}
#roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ccard{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.ccard:hover{border-color:var(--green)}.ccard.off{opacity:.55}
.ccard .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#FF0055,#cc0044);color:#fff;display:grid;place-items:center;font-weight:800}
.nm{flex:1;min-width:0;display:flex;flex-direction:column}.nm b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nm small{color:var(--mute);font-size:12px}
.sc{font-size:26px;font-weight:800}
.sbar{position:relative;height:8px;background:#0e111b;border-radius:99px;margin:4px 0 20px}
.sfill{height:100%;border-radius:99px;background:linear-gradient(90deg,#FF0055,var(--gold),var(--ok))}
.tick{position:absolute;top:-3px;width:2px;height:14px;background:var(--line)}
.tick.pass{background:#fff}.tick u{position:absolute;top:15px;left:-8px;width:18px;text-align:center;text-decoration:none;font-size:10px;color:var(--mute);font-style:normal}
.tick.bigt u{color:var(--text);font-weight:700}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12px;color:var(--mute)}
.mbar{display:block;height:4px;background:#0e111b;border-radius:99px;margin-top:3px;overflow:hidden}.mbar i{display:block;height:100%;background:var(--ok)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:11px;background:var(--panel2);border-radius:99px;padding:2px 8px;color:var(--mute)}
.tag.rec{color:var(--blue)}.tag.about{color:var(--pink)}.tag.hit{color:var(--gold)}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
#modalBg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
#modalBg.open{display:flex}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:22px;position:relative}
#modal h2{margin:0}#modal .sub{color:var(--mute);margin:2px 0 12px}
.x{position:absolute;top:10px;right:12px;background:none;border:0;font-size:26px;color:var(--mute)}
.big-score{display:flex;align-items:baseline;gap:10px}.big-score span{font-size:52px;font-weight:800;color:var(--ok)}.big-score small{color:var(--mute)}
.mlist{list-style:none;padding:0;margin:6px 0 14px}.mlist li{background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.mlist li.about{border-left:3px solid var(--pink)}.mlist li.hit{border-left:3px solid var(--gold)}.mlist .none{color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 div{background:var(--panel2);border-radius:8px;padding:8px 10px}
.grid2 small{display:block;color:var(--mute);font-size:12px}
.go{display:block;text-align:center;margin-top:14px;background:var(--green);color:#fff;font-weight:700;border-radius:10px;padding:10px;text-decoration:none}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:10px;z-index:60;width:min(360px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--pink);border-radius:12px;padding:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:in .35s ease}
.toast.hit{border-color:var(--gold);box-shadow:0 8px 30px rgba(255,215,0,.18)}
.toast.out{opacity:0;transform:translateX(30px);transition:.25s}
.toast .tb{flex:1;min-width:0;display:flex;flex-direction:column}.toast small{color:var(--mute)}
.tv{background:var(--green);color:#fff;border:0;border-radius:8px;padding:5px 10px;font-weight:700}
.tx{background:none;border:0;color:var(--mute);font-size:20px}
@keyframes in{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
@media (max-width:700px){#watchBody{grid-template-columns:1fr}.big-score span{font-size:42px}}
.addrw{margin-top:14px}.addrw form{display:grid;gap:8px;margin-top:8px}.addrw input,.addrw textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit}.addrw button.go{cursor:pointer;border:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Manager Hub <small><span id="who">Loading…</span> · <span id="stamp"></span></small></h1>
    <button class="hb" id="bell" title="Milestone watch">🔔<span id="bellN" style="display:none">0</span></button>
    <a class="hb" id="agentLink" href="agent-dashboard.html" style="color:inherit;text-decoration:none;display:none">Agent page</a>
    <button class="hb" id="logoutBtn">Log out</button>
  </header>
  <div id="switcher"></div>
  <div id="hubBody">
    <div id="stats"></div>
    <section id="watch">
      <h2>Milestone Watch <span class="sp"></span>
        <span id="kinds"><button data-kind="all" class="on">All</button><button data-kind="score">Score</button><button data-kind="days">Days</button><button data-kind="hours">Hours</button><button data-kind="tier">Tier</button></span>
      </h2>
      <div id="watchBody"></div>
    </section>
    <section>
      <h2>Roster <small style="color:var(--mute);font-weight:400"><span id="rosterCount">0</span> creators</small></h2>
      <div id="tools">
        <input type="search" id="q" placeholder="Search creators…">
        <select id="sortBy"><option value="close">Closest to a score milestone</option><option value="score">Highest score</option><option value="dia">Most diamonds</option><option value="name">Name</option></select>
        <label><input type="checkbox" id="fActive" checked> Active only</label>
        <label><input type="checkbox" id="fRecruited"> Recruited by them</label>
      </div>
      <div id="roster"></div>
    </section>
  </div>
</div>
<div id="modalBg"><div id="modal" role="dialog" aria-modal="true"></div></div>
<div id="toasts" aria-live="polite"></div>

<script src="js/manager-hub.js?v=202611061600"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyBrApQHC1Fvbjm9EVTptt2kNG2mDb1PzXE",
  authDomain: "taboost-platform.firebaseapp.com",
  projectId: "taboost-platform",
  storageBucket: "taboost-platform.firebasestorage.app",
  messagingSenderId: "379293685859",
  appId: "1:379293685859:web:d89592adbf67360b574056"
});
const auth = getAuth(app), db = getFirestore(app);
let redirecting = false;
const go = (u) => { redirecting = true; window.location.href = u; };

document.getElementById('logoutBtn').onclick = async () => { await signOut(auth); go('agent-login.html'); };

// agents.csv: email -> display name (e.g. dylanv2300@gmail.com -> Dylan)
async function agentNameByEmail(email) {
  try {
    const t = await (await fetch('data/agents.csv?v=' + Date.now())).text();
    const rows = ManagerHub.core.parseCsv(t);
    const hit = rows.find(r => (r[0] || '').trim().toLowerCase() === email);
    return hit && hit[1] ? hit[1].trim().toUpperCase() : '';
  } catch (e) { return ''; }
}

onAuthStateChanged(auth, async (user) => {
  if (redirecting) return;
  if (!user) return go('agent-login.html');
  try {
    const d = (await getDoc(doc(db, 'users', user.uid))).data() || {};
    const email = (user.email || '').toLowerCase();
    let role = d.role || 'creator';
    if (email === 'marco@taboost.me') role = 'admin';
    if (role === 'creator') return go('creator-dashboard.html');

    if (role === 'admin') {
      ManagerHub.init({ manager: '*', canSwitch: true });
      return;
    }
    // manager / agent: scoped to their own name only
    const first = (v) => String(v || '').trim().split(/[\s@]/)[0].toUpperCase();
    const name = String(d.managerName || '').trim().toUpperCase()
      || await agentNameByEmail(email)
      || first(d.displayName || d.name || d.agentName || user.displayName);
    if (role === 'agent') document.getElementById('agentLink').style.display = '';
    ManagerHub.init({ manager: name, canSwitch: false });
  } catch (err) {
    console.error('Manager hub auth error:', err);
    document.getElementById('who').textContent = 'Error loading — please refresh';
  }
});
</script>
</body>
</html>
